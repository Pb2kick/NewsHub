 # Replaced hardcoded DB URL with environment variable for Render deployment security.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
 # Replaced hardcoded DB username with environment variable placeholder.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
 # Replaced hardcoded DB password with environment variable placeholder.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
news.external.enabled=true
news.external.max-items=12
news.external.cache-minutes=10
 # Added stale-hours to control how old DB articles can be before re-fetching live feed.
news.external.stale-hours=6
